<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 230' font-family='Helvetica, Arial, sans-serif'><text x='0' y='46' font-size='13' fill='#7a8590' text-anchor='start' font-weight="700">Midnight split</text><rect x='92.0' y='10' width='166.0' height='60' fill='#8a949e' fill-opacity='0.18'/><text x='97.0' y='23' font-size='11' fill='#8a949e' text-anchor='start'>Mon night</text><rect x='260.0' y='10' width='166.0' height='60' fill='#8a949e' fill-opacity='0.1'/><text x='265.0' y='23' font-size='11' fill='#8a949e' text-anchor='start'>Tue night</text><rect x='428.0' y='10' width='166.0' height='60' fill='#8a949e' fill-opacity='0.18'/><text x='433.0' y='23' font-size='11' fill='#8a949e' text-anchor='start'>Wed night</text><rect x='256.5' y='32' width='52.5' height='22' rx='3' fill='#3d7fc4'/><text x='282.75' y='48' font-size='12' fill='#fff' text-anchor='middle' font-weight="700">A → Mon</text><rect x='431.5' y='32' width='52.5' height='22' rx='3' fill='#d03a3a'/><text x='457.75' y='48' font-size='12' fill='#fff' text-anchor='middle' font-weight="700">B → Wed</text><rect x='589.0' y='32' width='52.5' height='22' rx='3' fill='#d03a3a'/><text x='615.25' y='48' font-size='12' fill='#fff' text-anchor='middle' font-weight="700">C → Wed</text><text x='0' y='154' font-size='13' fill='#7a8590' text-anchor='start' font-weight="700">Noon-to-noon</text><rect x='176.0' y='118' width='166.0' height='60' fill='#8a949e' fill-opacity='0.18'/><text x='181.0' y='131' font-size='11' fill='#8a949e' text-anchor='start'>Mon night</text><rect x='344.0' y='118' width='166.0' height='60' fill='#8a949e' fill-opacity='0.1'/><text x='349.0' y='131' font-size='11' fill='#8a949e' text-anchor='start'>Tue night</text><rect x='512.0' y='118' width='166.0' height='60' fill='#8a949e' fill-opacity='0.18'/><text x='517.0' y='131' font-size='11' fill='#8a949e' text-anchor='start'>Wed night</text><rect x='256.5' y='140' width='52.5' height='22' rx='3' fill='#3d7fc4'/><text x='282.75' y='156' font-size='12' fill='#fff' text-anchor='middle' font-weight="700">A → Mon</text><rect x='431.5' y='140' width='52.5' height='22' rx='3' fill='#3d7fc4'/><text x='457.75' y='156' font-size='12' fill='#fff' text-anchor='middle' font-weight="700">B → Tue</text><rect x='589.0' y='140' width='52.5' height='22' rx='3' fill='#3d7fc4'/><text x='615.25' y='156' font-size='12' fill='#fff' text-anchor='middle' font-weight="700">C → Wed</text><text x='92.0' y='92' font-size='11' fill='#8a949e' text-anchor='middle'>Mon 0h</text><text x='176.0' y='92' font-size='11' fill='#8a949e' text-anchor='middle'>noon</text><text x='260.0' y='92' font-size='11' fill='#8a949e' text-anchor='middle'>Tue 0h</text><text x='344.0' y='92' font-size='11' fill='#8a949e' text-anchor='middle'>noon</text><text x='428.0' y='92' font-size='11' fill='#8a949e' text-anchor='middle'>Wed 0h</text><text x='512.0' y='92' font-size='11' fill='#8a949e' text-anchor='middle'>noon</text><text x='596.0' y='92' font-size='11' fill='#8a949e' text-anchor='middle'>Thu 0h</text><text x='680.0' y='92' font-size='11' fill='#8a949e' text-anchor='middle'>noon</text><text x='0' y='204' font-size='12' fill='#d03a3a' text-anchor='start'>Midnight split: night B starts at 00:30, so Tue gets no night and Wed gets two.</text><text x='0' y='222' font-size='12' fill='#7a8590' text-anchor='start'>Noon-to-noon: one night per date, whether sleep starts before or after midnight.</text></svg>